name: Create Pre-Release

on:
  workflow_run:
    workflows:
      - "Build and Push Pi (ARM64)"
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.4.5)'
        required: true
      sha:
        description: 'Commit SHA that all 3 build workflows ran against'
        required: true

jobs:
  release:
    # On workflow_run: only proceed if the triggering workflow succeeded on a v* tag
    # On workflow_dispatch: always proceed (manual invocation implies intent)
    # workflow_run.event == 'push' is safe because build-and-push-amd64 only triggers
    # on push: tags: v* — never on branch pushes — so 'push' always means a tag.
    # We avoid startsWith(head_branch, 'v') because GitHub Actions reports the
    # branch name (e.g. 'master') instead of the tag name for tag-triggered workflows.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check all builds succeeded for this tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          # Resolve tag from SHA — head_branch is unreliable for tag-triggered workflows
          HEAD_SHA=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.sha')
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh api "repos/$REPO/git/refs/tags" \
              --jq ".[] | select(.object.sha == \"$HEAD_SHA\") | .ref" \
              | sed 's|refs/tags/||' | head -1)
            if [ -z "$TAG" ]; then
              echo "::error::No tag found for SHA $HEAD_SHA — aborting release"
              exit 1
            fi
          fi
          echo "Resolved: tag=$TAG  sha=$HEAD_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          WORKFLOWS=(
            "Build and Push Simulator (AMD64)"
            "Build and Push Pi (ARM64)"
          )

          # Map workflow name → artifact name
          declare -A WF_ARTIFACTS=(
            ["Build and Push Simulator (AMD64)"]="matrixserver-simulator"
            ["Build and Push Pi (ARM64)"]="matrixserver-pi-arm64"
          )

          HEAD_SHA="${{ steps.check.outputs.sha }}"

          ALL_SUCCESS=true
          RUN_ARTIFACT_PAIRS=()

          for WF_NAME in "${WORKFLOWS[@]}"; do
            WF_ID=$(gh api "repos/$REPO/actions/workflows" \
              --jq ".workflows[] | select(.name == \"$WF_NAME\") | .id")

            # Fetch runs for the commit SHA, but explicitly filter to match the exact TAG name
            # This prevents matching old runs if multiple tags point to the same commit.
            RUN=$(gh api "repos/$REPO/actions/workflows/$WF_ID/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"${{ steps.check.outputs.tag }}\")][0]")

            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')

            echo "  $WF_NAME → conclusion=$CONCLUSION run_id=$RUN_ID"

            if [ "$CONCLUSION" != "success" ]; then
              ALL_SUCCESS=false
            else
              RUN_ARTIFACT_PAIRS+=("$RUN_ID:${WF_ARTIFACTS[$WF_NAME]}")
            fi
          done

          echo "all_success=$ALL_SUCCESS" >> $GITHUB_OUTPUT
          # Store as space-separated "run_id:artifact_name" pairs
          echo "run_artifact_pairs=${RUN_ARTIFACT_PAIRS[*]}" >> $GITHUB_OUTPUT

      - name: Download .deb artifacts from all workflow runs
        if: steps.check.outputs.all_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p debs
          for PAIR in ${{ steps.check.outputs.run_artifact_pairs }}; do
            RUN_ID="${PAIR%%:*}"
            ARTIFACT="${PAIR##*:}"
            gh run download "$RUN_ID" --repo "$REPO" --name "$ARTIFACT" --dir debs/
          done
          echo "Downloaded packages:"
          find debs/ -name "*.deb" | sort

      - name: Stage .deb files for upload
        if: steps.check.outputs.all_success == 'true'
        run: mv debs/*.deb .

      - name: Upload to APT Repository
        if: steps.check.outputs.all_success == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.UPLOAD_HOST }}
          username: ${{ vars.UPLOAD_USER }}
          key: ${{ secrets.UPLOAD_SSH_KEY }}
          source: "*.deb"
          target: "/docker/apt-repo/data/incoming/"

      - name: Create GitHub pre-release
        if: steps.check.outputs.all_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          DEB_FILES=$(find . -maxdepth 1 -name "*.deb" | tr '\n' ' ')
          
          # Find the latest full release (ignoring pre-releases)
          LATEST_RELEASE=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          
          NOTES_FLAG=""
          if [ -n "$LATEST_RELEASE" ]; then
            NOTES_FLAG="--notes-start-tag $LATEST_RELEASE"
          fi

          gh release create "$TAG" $DEB_FILES \
            --repo "${{ github.repository }}" \
            --prerelease \
            --generate-notes \
            $NOTES_FLAG \
            --title "Release $TAG" || \
          gh release upload "$TAG" $DEB_FILES --repo "${{ github.repository }}" --clobber
